services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roronoa
      POSTGRES_PASSWORD: roronoa
      POSTGRES_DB: roronoa
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # S3-compatible storage (stand-in for Cloudflare R2). Create the bucket with `bun run s3:init`.
  s3:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
